<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a href="#" class="logo">Sharp Edge Barbers</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">&#9776</button>
        <nav class="main-nav" id="mainNav">
            <ul>
                <li><a href="#Services">Services</a></li>
                <li><a href="#Gallery">Gallery</a></li>
                <li><a href="#Hours">Hours</a></li>
                <li><a href="#Book">Book</a></li>
            </ul>
        </nav>
    </header>
    <section class="hero">
        <div class="hero-content">
            <h1>Fresh cuts, every time</h1>
            <p>Sharp fades, cleanlines and a relaxed chair. Walk in or 
            book ahead</p>
            <a href="" class="btn">Book on whatsapp</a>
        </div>
    </section>
    <section id="services" class="section">
        <h2>Our Services</h2>
        <div class="services-grid" id="servicesGrid"></div>
    </section>

    <section id="gallery" class="section">
        <h2>Gallery</h2>
        <div class="slider">
            <button class="slider-btn" id="prevBtn" aria-label="Previous photo">‹</button>
            <img src="images/cut1.jpg" alt="Fresh fade haircut" id="sliderImage">
            <button class="slider-btn" id="nextBtn"  aria-label="Next photo">›</button>
        </div>
        <p class="slider-count" id="sliderCount"></p>
    </section>

    <section id="hours" class="section"> 
        <h2>Opening Hours</h2>
        <ul class="hours-list" id="hoursList"></ul>
        <p class="address">12 Sample Street, Airport Road,Abuja</p>
    </section>

    <footer class="site-footer">
        <p id="footerText"></p>
    </footer>
    <script src="index.js"></script>
</body>
</html>
